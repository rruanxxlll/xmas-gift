<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>圣诞森林的秘密信</title>
    <style>
        :root { 
            --gold: #f6ad55; --gold-glow: rgba(246, 173, 85, 0.6);
            --xmas-red: #c53030; --bg-dark: #0f172a; --glass: rgba(255, 255, 255, 0.08);
            --success: #48bb78; --error: #cbd5e0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white;
            font-family: "PingFang SC", sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* 封面 */
        #cover-page {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            transition: opacity 1s ease;
        }

        /* 游戏主体 */
        #game-world { 
            display: flex; flex-direction: column; 
            width: 100vw; height: 100dvh; 
            visibility: hidden; opacity: 0; transition: 1s; 
        }
        
        .story-header { flex-shrink: 0; padding: calc(15px + env(safe-area-inset-top)) 20px 10px; z-index: 5; }
        .story-box { 
            background: var(--glass); backdrop-filter: blur(10px); 
            padding: 12px 15px; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.1); 
            font-size: 0.9rem; text-align: center; line-height: 1.4; min-height: 3em;
        }

        .stage { flex: 1; display: flex; justify-content: center; align-items: center; gap: 160px; position: relative; }
        .char { width: 26vw; max-width: 100px; transition: all 1.8s ease; z-index: 2; }
        .char img { width: 100%; height: auto; border-radius: 12px; }
        .hug-glow { position: absolute; width: 150px; height: 150px; background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%); border-radius: 50%; opacity: 0; transform: scale(0); transition: 1.5s; z-index: 1; }

        .interaction-panel {
            flex-shrink: 0; background: white; border-radius: 35px 35px 0 0;
            padding: 20px 20px calc(50px + env(safe-area-inset-bottom)); 
            color: #1e293b; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); z-index: 10;
        }
        .dialogue-text { font-size: 0.95rem; font-weight: 600; text-align: center; margin-bottom: 15px; color: #334155; min-height: 2.5em; }
        
        .btn-opt { 
            width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; 
            padding: 12px 14px; border-radius: 14px; color: #475569; 
            margin-bottom: 8px; cursor: pointer; text-align: center; font-size: 0.85rem; 
            display: block; font-weight: 500; transition: all 0.3s;
        }
        /* 按鈕點擊變色 */
        .btn-correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .btn-wrong { background-color: var(--error) !important; color: #718096 !important; border-color: var(--error) !important; }

        #final-screen { 
            position: fixed; inset: 0; z-index: 4000; background: var(--bg-dark); 
            display: none; flex-direction: column; align-items: center; 
            overflow-y: auto; padding: calc(20px + env(safe-area-inset-top)) 20px 60px; 
        }
        .letter-container { width: 100%; max-width: 380px; background: #fffef2; padding: 30px 20px; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 8px double #e2e8f0; margin-bottom: 25px; }
        .letter-paper { color: #334155; line-height: 1.8; font-size: 0.95rem; }
        .voice-btn-luxe { background: linear-gradient(135deg, var(--gold), #d97706); border: none; padding: 18px; width: 100%; max-width: 380px; border-radius: 50px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .snow, .heart { position: fixed; pointer-events: none; z-index: 3000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<audio id="bg-music" loop preload="auto"><source src="bg.mp3" type="audio/mpeg"></audio>
<audio id="voice-audio" preload="auto"><source src="voice.mp3" type="audio/mpeg"></audio>
<audio id="song-far" preload="auto"><source src="far.mp3" type="audio/mpeg"></audio>
<audio id="song-sweet" preload="auto"><source src="sweet.mp3" type="audio/mpeg"></audio>

<div id="cover-page">
    <div style="text-align: center; background: var(--glass); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);">
        <h2 style="font-weight: 300; letter-spacing: 5px; margin: 0;">圣诞森林的秘密信</h2>
        <p style="color: var(--gold); letter-spacing: 3px; font-size: 0.8rem; margin: 15px 0 30px;">TO: 我的小兔子姐姐</p>
        <button style="background:none; border:1px solid var(--gold); color:var(--gold); padding:12px 35px; border-radius:50px; cursor:pointer;" onclick="start()">开启这份思念</button>
    </div>
</div>

<div id="game-world">
    <div class="story-header">
        <div class="story-box" id="story-display">✨ 圣诞森林飘起了雪，尼克正在等待小兔子... ✨</div>

            <button class="btn-opt" style="background:var(--gold); color:white; border:none; font-weight:bold;" onclick="renderNext()">✨ 进入圣诞森林</button>

<div id="final-screen">
    <div class="letter-container">
        <div class="letter-paper">
            亲爱的姐姐：<br><br>
            圣诞节快乐。想跟你说：在我面前，你永远可以是妳自己，厌世的，抓狂的，可爱的。<br><br>
            有烦恼很正常，但愿我俩都有多点发现快乐的好眼光。我会一直守着你，陪你在每个夜晚数星星。<br><br>
            希望你的快乐可以是因为我闯入了你的森林，成为你最好的陪伴。<br><br>
            圣诞真正的礼物，是有你有我，在一起。爱你乖乖~<br><br>
            <span style="float:right; font-weight:bold; color:var(--xmas-red);">圣诞快乐，我的小兔子 🦊</span>
        </div>
    </div>

    <button id="v-btn" class="voice-btn-luxe" onclick="playVoice()">▶ 听听尼克的语音信</button>

    <div id="extra-songs" style="display:none; width:100%; max-width:380px; margin-top:25px; text-align:center; animation: fadeIn 1.5s;">
        <div style="height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); margin-bottom: 20px;"></div>
        <p id="nick-hint" style="color:var(--gold); font-size:0.9rem; margin-bottom:15px; font-weight: bold; transition: 0.5s;">🦊：咳... 其实还有两首加码，妳想听哪首？</p>
        
        <div style="display:flex; gap:12px; padding: 0 10px;">
            <button id="btn-far" class="btn-opt" style="background:#4a5568; color:white; border:none; flex:1;" onclick="playSpecial('far')">🌌 多远都要在一起</button>
            <button id="btn-sweet" class="btn-opt" style="background:#ed64a6; color:white; border:none; flex:1;" onclick="playSpecial('sweet')">🎀 心愿便利贴</button>
        </div>
        <p id="song-status" style="color:white; font-size:0.8rem; margin-top:12px; opacity: 0.8;"></p>
    </div>

    <button style="margin-top: 40px; background:none; border:none; color:rgba(255,255,255,0.3); font-size: 0.75rem; text-decoration: underline; cursor:pointer; padding-bottom: 50px;" onclick="location.reload()">重新开启之旅</button>
</div>

<script>
    const steps = [
        { s: "两天前的冷战让空气结了冰。狐狸尼克慢慢走近了...", d: "🐰：这几天我安静了点，因为我在沉淀。但我从没想过走开。", o: ["🦊：我知道妳需要自己的独处，我只认你这个搭档。", "🦊：好会沉淀，那你沉淀得如何？", "🦊：哼!你倒是走走看啊？"] },
        { s: "雪越下越大，小兔子茱蒂不安地绞着手指...", d: "🐰：我有时很怪、脾气很差，你真的不会怕吗？", o: ["🦊：我不怕怪怪的你，我只怕你受伤了却不告诉我。", "🦊：救命！每天都想帮你挂号。", "🦊：怕死了，你发脾气我跑去看天数星星。"] },
        { s: "星光下，狐狸终于彻底靠近了兔子...", d: "🐰：所以...你真的会一直在吗？", o: ["🦊：不只是在，我会是你永远的避风港。乖乖。"] }
    ];

    let current = 0;
    const bgm = document.getElementById('bg-music');
    const vao = document.getElementById('voice-audio');
    let currentSpecial = null;

    function start() {
        document.getElementById('cover-page').style.opacity = '0';
        bgm.volume = 0.5;
        bgm.play().catch(()=>{});
        document.getElementById('story-display').innerText = steps[0].s; 
        setTimeout(() => {
            document.getElementById('cover-page').style.display = 'none';
            document.getElementById('game-world').style.visibility = 'visible';
            document.getElementById('game-world').style.opacity = '1';
        }, 800);
    }

    function renderNext() {
        const info = steps[current];
        document.getElementById('story-display').innerText = info.s;
        document.getElementById('dialogue-display').innerText = info.d;
        const box = document.getElementById('option-box');
        box.innerHTML = '';
        info.o.forEach((t, i) => {
            const b = document.createElement('button');
            b.className = 'btn-opt';
            b.innerText = t;
            b.onclick = () => {
                if(i === 0) {
                    b.classList.add('btn-correct'); // 點對變綠
                    setTimeout(() => {
                        current++;
                        if(current === steps.length) performHug();
                        else {
                            document.getElementById('stage').style.gap = (160 - (current * 80)) + "px";
                            renderNext();
                        }
                    }, 400);
                } else {
                    b.classList.add('btn-wrong'); // 點錯變灰
                    b.innerText = "❌ 尼克才不这样说呢！";
                    setTimeout(() => {
                        b.classList.remove('btn-wrong');
                        b.innerText = t;
                    }, 800);
                }
            };
            box.appendChild(b);
        });
    }

    function performHug() {
        document.getElementById('stage').style.gap = "0px";
        document.getElementById('bunny').style.transform = "translateX(30px)";
        document.getElementById('fox').style.transform = "translateX(-30px)";
        setTimeout(() => {
            document.getElementById('hug-glow').style.opacity = "1";
            document.getElementById('hug-glow').style.transform = "scale(1.1)";
            spawnHearts();
            setTimeout(() => { document.getElementById('final-screen').style.display = 'flex'; }, 2200);
        }, 800);
    }

    // 播放語音：務必停止背景音樂
    function playVoice() {
        if(currentSpecial) { currentSpecial.pause(); currentSpecial = null; }
        
        if(vao.paused) { 
            bgm.pause(); // 停止 BGM
            vao.volume = 1.0; 
            vao.play();
            document.getElementById('v-btn').innerHTML = "⏸ 正在聆听尼克..."; 
            vao.onended = () => { 
                bgm.play().catch(()=>{}); // 結束後恢復 BGM
                document.getElementById('v-btn').innerHTML = "▶ 听听尼克的语音信"; 
            };
        } else { 
            vao.pause(); 
            bgm.play().catch(()=>{}); 
            document.getElementById('v-btn').innerHTML = "▶ 听听尼克的语音信"; 
        }
        document.getElementById('extra-songs').style.display = 'block';
    }

    // 播放加碼歌曲：務必停止背景音樂與語音
    function playSpecial(type) {
        vao.pause();
        bgm.pause(); // 停止 BGM
        if(currentSpecial) currentSpecial.pause();

        const hintText = document.getElementById('nick-hint');
        const statusText = document.getElementById('song-status');

        if(type === 'far') {
            currentSpecial = document.getElementById('song-far');
            hintText.innerText = "🦊：就知道你要选这个。(🌌)";
            hintText.style.color = "#a3bffa"; 
            statusText.innerText = "🎵 正在为你演唱《多远都要在一起》...";
        } else {
            currentSpecial = document.getElementById('song-sweet');
            hintText.innerText = "🦊：甜歌代表我的心情。(🎀)";
            hintText.style.color = "#fbb6ce"; 
            statusText.innerText = "🎵 正在为你演唱《心愿便利贴》...";
        }

        currentSpecial.currentTime = 0;
        currentSpecial.play();
        
        currentSpecial.onended = () => {
            hintText.innerText = "🦊：听完啦，还要听另一首吗？";
            hintText.style.color = "var(--gold)";
            statusText.innerText = "💖 这首歌，送给最特别的你。";
            bgm.play().catch(()=>{}); // 結束後恢復 BGM
        };
    }

    function spawnHearts() {
        for(let i=0; i<30; i++) {
            setTimeout(() => {
                const h = document.createElement('div'); h.className = 'heart'; h.innerText = '❤️';
                h.style.left = Math.random() * 100 + 'vw'; h.style.top = '-20px';
                h.style.animation = `fall ${Math.random()*2+2}s linear forwards`;
                document.body.appendChild(h);
            }, i * 70);
        }
    }

    setInterval(() => {
        const s = document.createElement('div'); s.className = 'snow'; s.innerText = '❄️';
        s.style.left = Math.random() * 100 + 'vw'; s.style.top = '-20px';
        s.style.animation = `fall ${Math.random()*3+4}s linear forwards`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 5000);
    }, 600);
</script>
</body>
</html>
