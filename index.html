<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聖誕森林的秘密信</title>
    <style>
        :root { 
            --gold: #f6ad55; 
            --gold-glow: rgba(246, 173, 85, 0.6);
            --bg-dark: #0f172a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); color: white;
            font-family: -apple-system, "PingFang SC", sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* 封面 */
        #cover-page {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            transition: opacity 0.5s;
        }

        #game-world { 
            display: flex; flex-direction: column; 
            width: 100vw; height: 100dvh; 
            visibility: hidden; opacity: 0; 
        }
        
        .story-header { flex-shrink: 0; padding: calc(20px + env(safe-area-inset-top)) 20px 10px; }
        .story-box { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); 
            padding: 15px; border-radius: 15px; text-align: center; font-size: 0.9rem; 
        }

        .stage { flex: 1; display: flex; justify-content: center; align-items: center; gap: 160px; position: relative; }
        .char { width: 26vw; max-width: 100px; transition: all 1s ease; }
        .char img { width: 100%; height: auto; border-radius: 10px; }

        /* 底部控制區：提高 z-index 確保可點擊 */
        .interaction-panel {
            position: relative; z-index: 100;
            flex-shrink: 0; background: white; border-radius: 30px 30px 0 0;
            padding: 25px 25px calc(60px + env(safe-area-inset-bottom)); 
            color: #1e293b; box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        }
        .dialogue-text { font-size: 1rem; font-weight: 600; text-align: center; margin-bottom: 20px; min-height: 3em; }
        
        .btn-opt { 
            width: 100%; background: #f1f5f9; border: 1px solid #e2e8f0; 
            padding: 16px; border-radius: 15px; color: #334155; 
            margin-bottom: 10px; cursor: pointer; text-align: center; font-size: 1rem;
            display: block; font-weight: bold;
        }

        #final-screen { 
            position: fixed; inset: 0; z-index: 9000; background: var(--bg-dark); 
            display: none; flex-direction: column; align-items: center; 
            overflow-y: auto; padding: calc(40px + env(safe-area-inset-top)) 20px 60px; 
        }
        .letter-container { 
            width: 100%; max-width: 380px; background: #fffef2; padding: 25px; 
            border-radius: 5px; border: 8px double #e2e8f0; color: #334155; line-height: 1.8;
        }

        .snow { position: fixed; top: -10px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh); } }
    </style>
</head>
<body>

<audio id="bg-music" loop><source src="download (1).mp3" type="audio/mpeg"></audio>
<audio id="voice-audio"><source src="聖誕快樂.m4a" type="audio/mp4"></audio>

<div id="cover-page" onclick="startGame()">
    <div style="text-align: center; pointer-events: none;">
        <h2 style="letter-spacing: 3px;">聖誕森林的秘密信</h2>
        <p style="color: var(--gold); margin-bottom: 30px;">TO: 我的小兔子姐姐</p>
        <div style="border: 1px solid var(--gold); padding: 10px 30px; border-radius: 50px; color: var(--gold);">點擊螢幕開啟</div>
    </div>
</div>

<div id="game-world">
    <div class="story-header"><div class="story-box" id="story-display">✨ 聖誕森林飄起了雪，尼克正在等你... ✨</div></div>
    <div class="stage" id="stage">
        <div class="char" id="bunny"><img src="https://cdn.discordapp.com/attachments/1453714765838024887/1453715624369848400/7db4a8924bf73a89a237186c46d2f1ee.png?ex=694e75ad&is=694d242d&hm=c0e63ec216c3b07a9d18a768e3fca9086aa596b00045d54b420508f6286aa26b"></div>
        <div class="char" id="fox"><img src="https://cdn.discordapp.com/attachments/1453714765838024887/1453721279503929435/b94d5ba42fe7b6d44b40d34437ceee61.png?ex=694e7af1&is=694d2971&hm=d3506fcf311cd85a6bfe6861cec737d8fdac0f0eec5313fbf1bb8133b980821b"></div>
    </div>
    <div class="interaction-panel">
        <div class="dialogue-text" id="dialogue-display">點擊下方，開啟這場關於陪伴的冒險。</div>
        <div id="option-box">
            <button id="main-btn" class="btn-opt" style="background:var(--gold); color:white; border:none;" onclick="handleNext()">✨ 進入森林</button>
            <button id="sub-btn" class="btn-opt" style="display:none;" onclick="handleWrong()">選項二</button>
        </div>
    </div>
</div>

<div id="final-screen">
    <div class="letter-container">
        親愛的姐姐：<br><br>
        聖誕節快樂。想跟你說：在我面前，你永遠可以是妳自己，厭世的，抓狂的，可愛的。<br><br>
        有煩惱很正常，但願我倆都有多點發現快樂的好眼光。我會一直守著你，陪你在每個夜晚數星星。<br><br>
        希望你的快樂可以是因為我闖入了你的森林，成為你最好的陪伴。<br><br>
        聖誕真正的禮物，是有你有我，在一起。愛你乖乖~<br><br>
        <span style="float:right; font-weight:bold; color:#c53030;">聖誕快樂，我的小兔子 🦊</span>
    </div>
    <button id="v-btn" class="btn-opt" style="margin-top:20px; background:linear-gradient(135deg, var(--gold), #d97706); color:white; border:none;" onclick="toggleVoice()">▶ 聽聽尼克的語音信</button>
</div>

<script>
    let current = 0;
    const bgm = document.getElementById('bg-music');
    const vao = document.getElementById('voice-audio');

    const scripts = [
        { s: "兩天前的冷戰讓空氣結了冰。狐狸尼克慢慢走近了...", d: "🐰：這幾天我安靜了點，因為我在沉澱。但我從沒想過走開。", o1: "🦊：我不在乎你愛不愛我，我只認你這個搭檔。", o2: "🦊：你沉澱得如何？" },
        { s: "雪越下越大，小兔子茱蒂不安地絞著手指...", d: "🐰：我有時很怪、脾氣很差，你真的不會怕嗎？", o1: "🦊：我不怕怪怪的你，我只怕你受傷了卻不告訴我。", o2: "🦊：每天都想幫你掛號。" },
        { s: "星光下，狐狸終於徹底靠近了兔子...", d: "🐰：所以...你真的會一直在嗎？", o1: "🦊：不只是在，我會是你永遠的避風港。聖誕快樂。", o2: "" }
    ];

    function startGame() {
        document.getElementById('cover-page').style.opacity = '0';
        bgm.volume = 0.4;
        bgm.play();
        setTimeout(() => {
            document.getElementById('cover-page').style.display = 'none';
            document.getElementById('game-world').style.visibility = 'visible';
            document.getElementById('game-world').style.opacity = '1';
        }, 500);
    }

    function handleNext() {
        if (current < scripts.length) {
            const data = scripts[current];
            document.getElementById('story-display').innerText = data.s;
            document.getElementById('dialogue-display').innerText = data.d;
            document.getElementById('main-btn').innerText = data.o1;
            
            if (data.o2) {
                document.getElementById('sub-btn').style.display = 'block';
                document.getElementById('sub-btn').innerText = data.o2;
            } else {
                document.getElementById('sub-btn').style.display = 'none';
            }
            
            // 讓角色靠近
            document.getElementById('stage').style.gap = (160 - (current * 80)) + "px";
            current++;
        } else {
            // 結局動畫
            document.getElementById('stage').style.gap = "0px";
            document.getElementById('bunny').style.transform = "translateX(20px)";
            document.getElementById('fox').style.transform = "translateX(-20px)";
            setTimeout(() => {
                document.getElementById('final-screen').style.display = 'flex';
            }, 1000);
        }
    }

    function handleWrong() {
        const btn = document.getElementById('sub-btn');
        const oldText = btn.innerText;
        btn.innerText = "❌ 尼克才不這樣說呢！";
        setTimeout(() => { btn.innerText = oldText; }, 800);
    }

    function toggleVoice() {
        if (vao.paused) {
            bgm.volume = 0.01; // 背景音降到最低
            vao.volume = 1.0;
            vao.play();
            document.getElementById('v-btn').innerText = "⏸ 正在播放尼克的聲音...";
            vao.onended = () => {
                bgm.volume = 0.4;
                document.getElementById('v-btn').innerText = "▶ 重新聽一次";
            };
        } else {
            vao.pause();
            bgm.volume = 0.4;
            document.getElementById('v-btn').innerText = "▶ 聽聽尼克的語音信";
        }
    }

    // 雪花背景
    setInterval(() => {
        const s = document.createElement('div');
        s.className = 'snow';
        s.innerText = '❄️';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.fontSize = Math.random() * 10 + 10 + 'px';
        s.style.animationDuration = Math.random() * 3 + 4 + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 5000);
    }, 500);
</script>
</body>
</html>
